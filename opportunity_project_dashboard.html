<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Opportunity Project — Topic Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg:       #0a0c10;
  --surface:  #12151c;
  --card:     #181c26;
  --border:   #252a38;
  --text:     #e8eaf0;
  --muted:    #6b7280;
  --accent:   #4f8ef7;
  --fh: 'DM Serif Display', Georgia, serif;
  --fb: 'DM Mono', 'Courier New', monospace;
}

* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  background:var(--bg);
  color:var(--text);
  font-family:var(--fb);
  font-size:13px;
  line-height:1.65;
  min-height:100vh;
}

/* ── HEADER ── */
.header {
  position:sticky; top:0; z-index:100;
  background:rgba(10,12,16,0.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:16px 32px;
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
}
.header h1 {
  font-family:var(--fh); font-size:20px;
  color:var(--text); flex:1;
  letter-spacing:-0.3px;
}
.header h1 span { color:var(--accent); }
.filter-bar { display:flex; gap:8px; flex-wrap:wrap; }
.filter-btn {
  background:var(--surface); border:1px solid var(--border);
  color:var(--muted); border-radius:20px;
  padding:5px 14px; font-family:var(--fb); font-size:11px;
  cursor:pointer; transition:all .15s;
  text-transform:uppercase; letter-spacing:.5px;
}
.filter-btn:hover, .filter-btn.active {
  color:var(--text);
  border-color:var(--accent);
  background:rgba(79,142,247,.12);
}
.search-wrap {
  position:relative;
}
.search-wrap input {
  background:var(--surface); border:1px solid var(--border);
  color:var(--text); border-radius:20px;
  padding:5px 14px 5px 32px; font-family:var(--fb); font-size:11px;
  width:180px; outline:none; transition:border-color .15s;
}
.search-wrap input:focus { border-color:var(--accent); }
.search-wrap::before {
  content:'⌕'; position:absolute; left:11px; top:5px;
  color:var(--muted); font-size:13px; pointer-events:none;
}

/* ── MAIN LAYOUT ── */
.main {
  max-width:1400px; margin:0 auto; padding:28px 24px 60px;
  display:grid; grid-template-columns:1fr 1fr; gap:24px;
}
@media(max-width:900px) { .main { grid-template-columns:1fr; } }

/* ── STAT CARDS ── */
.stat-row {
  grid-column:1/-1;
  display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;
}
.stat-card {
  background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:16px 20px;
  animation:fadeUp .4s ease both;
}
.stat-card .val {
  font-family:var(--fh); font-size:28px; color:var(--accent); display:block;
}
.stat-card .lbl {
  color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.8px;
  margin-top:3px; display:block;
}

/* ── CHARTS SECTION ── */
.charts-row {
  grid-column:1/-1;
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;
}
@media(max-width:1100px) { .charts-row { grid-template-columns:1fr 1fr; } }
@media(max-width:700px)  { .charts-row { grid-template-columns:1fr; } }

.chart-card {
  background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:18px 18px 14px;
  animation:fadeUp .5s ease both;
}
.chart-card h3 {
  font-family:var(--fh); font-size:14px; color:var(--text);
  margin-bottom:14px; letter-spacing:-0.2px;
}
.chart-wrap { position:relative; height:220px; }

/* ── TOPIC GRID ── */
.topics-section {
  grid-column:1/-1;
}
.section-title {
  font-family:var(--fh); font-size:18px; color:var(--text);
  margin-bottom:16px; letter-spacing:-0.3px;
}
.topics-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:14px;
}

/* ── TOPIC CARD ── */
.topic-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:12px; overflow:hidden;
  cursor:pointer; transition:border-color .2s, transform .15s, box-shadow .2s;
  animation:fadeUp .4s ease both;
}
.topic-card:hover {
  transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}
.topic-card.hidden { display:none; }

.tc-header {
  display:flex; align-items:flex-start; gap:12px;
  padding:16px 18px 12px;
  border-bottom:1px solid var(--border);
}
.tc-icon {
  width:36px; height:36px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; flex-shrink:0;
}
.tc-meta { flex:1; min-width:0; }
.tc-name {
  font-family:var(--fh); font-size:15px; color:var(--text);
  line-height:1.3; margin-bottom:4px;
}
.tc-cat {
  font-size:10px; text-transform:uppercase; letter-spacing:.7px;
  padding:2px 8px; border-radius:10px; display:inline-block;
}
.tc-rank {
  font-size:10px; color:var(--muted); flex-shrink:0; padding-top:2px;
}

/* score bar */
.tc-score {
  display:flex; align-items:center; gap:10px;
  padding:10px 18px; border-bottom:1px solid var(--border);
}
.tc-score-label { color:var(--muted); font-size:10px; min-width:80px; text-transform:uppercase; }
.tc-bar-wrap {
  flex:1; background:rgba(255,255,255,.06); border-radius:3px; height:6px; overflow:hidden;
}
.tc-bar { height:100%; border-radius:3px; }
.tc-score-val { font-size:11px; color:var(--text); min-width:30px; text-align:right; }

/* keyword pills */
.tc-keywords {
  display:flex; flex-wrap:wrap; gap:5px; padding:10px 18px;
  border-bottom:1px solid var(--border);
}
.kw {
  font-size:10px; border-radius:4px; padding:2px 8px;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
  color:var(--muted);
}

/* doc count */
.tc-docs {
  padding:8px 18px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:8px;
}
.tc-docs-bar-wrap {
  flex:1; background:rgba(255,255,255,.05); border-radius:3px; height:4px; overflow:hidden;
}
.tc-docs-bar { height:100%; border-radius:3px; opacity:.6; }
.tc-docs-label { color:var(--muted); font-size:10px; text-transform:uppercase; min-width:80px; }
.tc-docs-val { font-size:11px; color:var(--text); min-width:60px; text-align:right; }

/* transcripts accordion */
.tc-transcripts { padding:10px 18px 14px; }
.tc-trans-label {
  font-size:10px; color:var(--muted); text-transform:uppercase;
  letter-spacing:.7px; margin-bottom:8px;
  display:flex; align-items:center; gap:6px;
}
.tc-trans-label span {
  background:rgba(79,142,247,.15); color:var(--accent);
  border-radius:10px; padding:1px 7px;
}
.trans-item {
  border:1px solid var(--border); border-radius:6px; margin-bottom:6px; overflow:hidden;
}
.trans-summary {
  display:flex; align-items:center; gap:8px;
  padding:7px 12px; cursor:pointer;
  background:rgba(255,255,255,.02);
  user-select:none; list-style:none;
  transition:background .15s;
}
.trans-summary:hover { background:rgba(255,255,255,.05); }
.trans-summary::-webkit-details-marker { display:none; }
details[open] .trans-summary { background:rgba(79,142,247,.07); }
.trans-name { flex:1; color:var(--text); font-size:11px; }
.trans-time {
  color:var(--muted); font-size:10px;
  background:rgba(255,255,255,.05); border-radius:4px; padding:1px 7px;
}
.trans-lines {
  padding:10px 12px;
  background:rgba(0,0,0,.3); border-top:1px solid var(--border);
  color:var(--muted); font-size:10px; line-height:1.8;
  white-space:pre-wrap; word-break:break-word; max-height:260px; overflow-y:auto;
}

/* no results */
.no-results {
  grid-column:1/-1; text-align:center;
  padding:60px 20px; color:var(--muted); font-size:14px;
  display:none;
}
.no-results.visible { display:block; }

/* animations */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}

footer {
  text-align:center; padding:24px;
  color:var(--muted); font-size:10px;
  border-top:1px solid var(--border);
  letter-spacing:.5px; text-transform:uppercase;
}
</style>
</head>

const CAT_COLORS = {"Education": "#4f8ef7", "Creative & Arts": "#f76b8a", "Mental Health": "#f7a94f", "Work & Career": "#4fdb9a", "Health & Wellness": "#b47ef7", "Technology": "#4fd6f7"};

// ── Stat cards ──────────────────────────────────────────────────────────────
const totalDocs = TOPICS.reduce((s,t) => s + t.doc_count, 0);
const totalFiles = new Set(TOPICS.flatMap(t => t.transcripts.map(r => r.name))).size;
const stats = [
  { val: TOPICS.length,              lbl: 'Topics Discovered' },
  { val: totalDocs,                  lbl: 'Document Chunks' },
  { val: Object.keys(CATEGORIES).length, lbl: 'Categories' },
  { val: totalFiles,                 lbl: 'Transcripts Linked' },
  { val: Math.max(...TOPICS.map(t=>t.composite_score)).toFixed(1), lbl: 'Top Quality Score' },
];
const statRow = document.getElementById('statRow');
stats.forEach((s,i) => {
  const el = document.createElement('div');
  el.className = 'stat-card';
  el.style.animationDelay = i*0.07+'s';
  el.innerHTML = `<span class="val">${s.val}</span><span class="lbl">${s.lbl}</span>`;
  statRow.appendChild(el);
});

// ── Filter buttons ──────────────────────────────────────────────────────────
const filterBar = document.getElementById('filterBar');
Object.keys(CAT_COLORS).forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.dataset.cat = cat;
  btn.textContent = cat;
  btn.style.setProperty('--cat-color', CAT_COLORS[cat]);
  filterBar.appendChild(btn);
});

let activeFilter = 'All';
let searchTerm   = '';

filterBar.addEventListener('click', e => {
  if (!e.target.classList.contains('filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeFilter = e.target.dataset.cat;
  applyFilters();
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase();
  applyFilters();
});

function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.topic-card').forEach(card => {
    const catMatch  = activeFilter === 'All' || card.dataset.cat === activeFilter;
    const termMatch = !searchTerm ||
      card.dataset.name.toLowerCase().includes(searchTerm) ||
      card.dataset.kws.toLowerCase().includes(searchTerm);
    const show = catMatch && termMatch;
    card.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  document.getElementById('noResults').classList.toggle('visible', visible === 0);
}

// ── Topic cards ─────────────────────────────────────────────────────────────
const grid = document.getElementById('topicsGrid');
const maxScore = Math.max(...TOPICS.map(t => t.composite_score));
const maxDocs  = Math.max(...TOPICS.map(t => t.doc_count));

TOPICS.forEach((t, i) => {
  const card = document.createElement('div');
  card.className = 'topic-card';
  card.dataset.cat  = t.category;
  card.dataset.name = t.name;
  card.dataset.kws  = t.keywords.join(' ');
  card.style.animationDelay = (i * 0.06) + 's';
  card.style.setProperty('--topic-color', t.color);
  card.style.borderColor = 'var(--border)';
  card.addEventListener('mouseenter', () => card.style.borderColor = t.color + '66');
  card.addEventListener('mouseleave', () => card.style.borderColor = 'var(--border)');

  const scoreBarPct  = (t.composite_score / maxScore * 100).toFixed(1);
  const docsBarPct   = (t.doc_count / maxDocs * 100).toFixed(1);
  const catColor     = CAT_COLORS[t.category] || '#888';

  const kwHtml = t.keywords.map(k =>
    `<span class="kw">${k}</span>`).join('');

  const transHtml = t.transcripts.map(r => {
    const dur = (r.end - r.start).toFixed(0);
    const safeLines = r.lines
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `
    <details class="trans-item">
      <summary class="trans-summary">
        <span class="trans-name">👤 ${r.name}</span>
        <span class="trans-time">${r.start}s &ndash; ${r.end}s (${dur}s)</span>
      </summary>
      <pre class="trans-lines">${safeLines}</pre>
    </details>`;
  }).join('');

  card.innerHTML = `
    <div class="tc-header">
      <div class="tc-icon" style="background:${t.color}22;">${t.icon}</div>
      <div class="tc-meta">
        <div class="tc-name">${t.name}</div>
        <span class="tc-cat" style="background:${catColor}22;color:${catColor};">${t.category}</span>
      </div>
      <div class="tc-rank">#${t.rank}</div>
    </div>
    <div class="tc-score">
      <span class="tc-score-label">Quality</span>
      <div class="tc-bar-wrap">
        <div class="tc-bar" style="width:${scoreBarPct}%;background:${t.color};"></div>
      </div>
      <span class="tc-score-val">${t.composite_score}</span>
    </div>
    <div class="tc-keywords">${kwHtml}</div>
    <div class="tc-docs">
      <span class="tc-docs-label">Coverage</span>
      <div class="tc-docs-bar-wrap">
        <div class="tc-docs-bar" style="width:${docsBarPct}%;background:${t.color};"></div>
      </div>
      <span class="tc-docs-val">${t.doc_count} docs (${t.doc_pct}%)</span>
    </div>
    <div class="tc-transcripts">
      <div class="tc-trans-label">Transcript Evidence <span>${t.transcripts.length} file${t.transcripts.length!==1?'s':''}</span></div>
      ${transHtml || '<span style="color:var(--muted);font-size:11px;">No direct matches found.</span>'}
    </div>`;

  grid.appendChild(card);
});

      hoverOffset: 6,
    }]
  },
  options: {
    responsive:true, maintainAspectRatio:false,
    cutout: '60%',
    plugins: {
      legend:{ position:'bottom', labels:{ boxWidth:10, padding:10, color:'#9ca3af' } },
      tooltip:{callbacks:{ label: ctx => ` ${ctx.label}: ${ctx.raw} docs` }}
    }
  }
});

// Bubble — quality score vs coverage
new Chart(document.getElementById('bubbleChart'), {
  type: 'bubble',
  data: {
    datasets: TOPICS.map(t => ({
      label: t.name,
      data: [{
        x: t.doc_pct,
        y: t.composite_score,
        r: Math.max(6, Math.sqrt(t.doc_count) * 1.8)
      }],
      backgroundColor: t.color + '88',
      borderColor:     t.color,
      borderWidth: 1.5,
    }))
  },
  options: {
    responsive:true, maintainAspectRatio:false,
    plugins: {
      legend:{display:false},
      tooltip:{callbacks:{
        label: ctx => {
          const t = TOPICS[ctx.datasetIndex];
          return [`${t.name}`, `Coverage: ${t.doc_pct}%`, `Score: ${t.composite_score}`];
        }
      }}
    },
    scales: {
      x: {
        title:{ display:true, text:'Coverage (%)', color:'#6b7280' },
        grid:{color:'rgba(255,255,255,.05)'}, ticks:{color:'#6b7280'}
      },
      y: {
        title:{ display:true, text:'Quality Score', color:'#6b7280' },
        grid:{color:'rgba(255,255,255,.05)'}, ticks:{color:'#6b7280'}
      }
    }
  }
});
</script>
</body>
</html>
